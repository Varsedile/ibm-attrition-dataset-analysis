services:
  db:
    image: postgres
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432

volumes:
  postgres:
    driver: local
    driver_opts:
      type: none
      device: ./postgres
      o: bind